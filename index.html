<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CycleSync - Master Your Cycle | 100% Private Period & PCOD Tracker</title>
    <meta name="description" content="Track periods, predict ovulation, log symptoms & assess PCOD risk — 100% private, offline, and free." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/ic_launcher-playstore-removebg-preview.png" />
    <meta name="theme-color" content="#B95679" />
    
    <!-- React Refresh Preamble for Vite Dev -->
    <script type="module">
      import RefreshRuntime from '/@react-refresh'
      RefreshRuntime.injectIntoGlobalHook(window)
      window.$RefreshReg$ = () => {}
      window.$RefreshSig$ = () => (type) => type
      window.__vite_plugin_react_preamble_installed__ = true
    </script>

    <!-- Google Fonts: Plus Jakarta Sans for UI/Body, Outfit for Display, JetBrains Mono for Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- jsPDF CDN for offline PDF report generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body class="bg-[#FFF8F8] text-[#16213E] font-sans antialiased selection:bg-[#B95679] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Unregister service workers in development environment to avoid stale cache issues
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
